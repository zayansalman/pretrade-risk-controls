[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pretrade-gate"
version = "1.0.0"
description = "Pre-trade risk gate with a trailing daily-loss halt, extracted from a real-money trading system. Zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zayan Khan" }]
keywords = ["trading", "risk", "risk-management", "pre-trade", "kill-switch"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.20"]
dev = ["pytest", "pytest-asyncio", "ruff", "aiosqlite>=0.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/pretrade_gate"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
