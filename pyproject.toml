[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pretrade-risk"
version = "2.0.0"
description = "Venue-independent pre-trade risk controls: order validation, price bands, message throttles, position and exposure limits, and a trailing daily loss limit. Zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zayan Khan" }]
keywords = [
    "trading",
    "risk",
    "risk-management",
    "pre-trade",
    "pre-trade-risk",
    "ptrm",
    "market-access",
    "kill-switch",
    "order-validation",
    "trading-limits",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.20"]
dev = ["pytest", "pytest-asyncio", "ruff>=0.16,<0.17", "aiosqlite>=0.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/pretrade_risk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["pretrade_risk"]
# The test suite imports shared constants from its own conftest. That is a
# local-folder import, not a third-party one, and saying so keeps it sorted
# last instead of being grouped in with pytest.
known-local-folder = ["conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
